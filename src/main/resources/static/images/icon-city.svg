<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- City: a castle-like building with tower and crenellations -->
  <!-- Main building -->
  <rect x="25" y="40" width="50" height="45" fill="#D4A017" stroke="#333" stroke-width="2"/>
  <!-- Crenellations on main building -->
  <rect x="25" y="34" width="10" height="8" fill="#D4A017" stroke="#333" stroke-width="2"/>
  <rect x="40" y="34" width="10" height="8" fill="#D4A017" stroke="#333" stroke-width="2"/>
  <rect x="55" y="34" width="10" height="8" fill="#D4A017" stroke="#333" stroke-width="2"/>
  <rect x="70" y="34" width="5" height="8" fill="#D4A017" stroke="#333" stroke-width="2"/>
  <!-- Tower -->
  <rect x="38" y="12" width="24" height="30" fill="#B8860B" stroke="#333" stroke-width="2"/>
  <!-- Tower crenellations -->
  <rect x="38" y="6" width="8" height="8" fill="#B8860B" stroke="#333" stroke-width="2"/>
  <rect x="50" y="6" width="12" height="8" fill="#B8860B" stroke="#333" stroke-width="2"/>
  <!-- Arched doorway -->
  <rect x="42" y="62" width="16" height="23" rx="8" fill="#5D4037" stroke="#333" stroke-width="2"/>
  <!-- Window -->
  <circle cx="50" cy="28" r="5" fill="#FDD835" stroke="#333" stroke-width="1.5"/>
  <!-- Base -->
  <line x1="20" y1="85" x2="80" y2="85" stroke="#333" stroke-width="3"/>
</svg>
